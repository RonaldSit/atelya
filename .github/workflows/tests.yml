name: tests

on:
  push:
    branches: [main, "feat/**", "scratch/**"]
  pull_request:

jobs:
  test:
    # ubuntu-latest is ubuntu-26.04, for which setup-python has no 3.12.3 build: since
    # c384b7c added it, the 3.12.3 job failed at setup and never ran a test. It runs on
    # ubuntu-24.04, the system it stands for.
    runs-on: ${{ matrix.python-version == '3.12.3' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12.3 is Ubuntu 24.04's system Python. On 3.10, 3.11, 3.12.0-3.12.6 and
        # 3.13.0, argparse's parse_args rejects an option between the subcommand and
        # a positional; "3.12" alone resolves to the newest 3.12, where it works.
        python-version: ["3.10", "3.11", "3.12.3", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Interpreter (exact version in the log)
        run: python -VV
      - name: Install test runner
        run: pip install pytest
      - name: Install the [ots] extra, pinned (Python 3.11+; 3.10 tests the refusal without it)
        if: matrix.python-version != '3.10'
        run: pip install -c tests/ots-constraints.txt opentimestamps opentimestamps-client
      - name: Require the extra where it can be installed
        if: matrix.python-version != '3.10'
        run: echo "ATELYA_REQUIRE_OTS=1" >> "$GITHUB_ENV"
      - name: Run test suite
        run: python tools/test_counts.py run pytest-tests -- python -m pytest tests/ -q
      - name: The suite ran, with the count in tests/expected_counts.json
        if: ${{ !cancelled() }}
        run: python tools/test_counts.py check --job test --variant ${{ matrix.python-version }}
      - name: Upload the counts for ci-summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: counts-${{ github.job }}-${{ matrix.python-version || 'default' }}
          path: test-results/
          if-no-files-found: warn

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff~=0.15.0"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Every CLI answers --help fast (stdin closed, timed)
        run: |
          for b in atelya-attest atelya-anchor atelya-govern; do
            timeout 10 "$b" --help </dev/null >/dev/null
          done

  ci-summary:
    # Every test job uploads its counts. This job fails when one uploaded none, when a count
    # differs from tests/expected_counts.json, or when any job did not succeed.
    if: ${{ always() }}
    needs: [test, lint, cli-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download every job's counts
        uses: actions/download-artifact@v4
        with:
          pattern: counts-*
          path: all-counts
      - name: Every job uploaded its counts, every count matches, every job succeeded
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python tools/test_counts.py summary --root all-counts --needs-env NEEDS
