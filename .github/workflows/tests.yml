name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.12.3 is Ubuntu 24.04's system Python. On 3.10, 3.11, 3.12.0-3.12.6 and
        # 3.13.0, argparse's parse_args rejects an option between the subcommand and
        # a positional; "3.12" alone resolves to the newest 3.12, where it works.
        python-version: ["3.10", "3.11", "3.12.3", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Interpreter (exact version in the log)
        run: python -VV
      - name: Install test runner
        run: pip install pytest
      - name: Run test suite
        run: python -m pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install "ruff~=0.15.0"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .

  cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Every CLI answers --help fast (stdin closed, timed)
        run: |
          for b in atelya-attest atelya-anchor atelya-govern; do
            timeout 10 "$b" --help </dev/null >/dev/null
          done

